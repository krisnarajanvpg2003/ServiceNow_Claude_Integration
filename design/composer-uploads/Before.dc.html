<!doctype html>
<html>

<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif; font-size: 15px; line-height: 1.5; }
    a { color: #b33a0c; } a:hover { color: #8f2e09; }

</helmet>

<div style="background: #faf8f4; padding: 26px 28px 34px; min-height: 100%; box-sizing: border-box;">

  <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 20px;">
    <span style="display: inline-block; padding: 3px 9px; border-radius: 999px; background: #fff1ea; color: #b33a0c; border: 1px solid #fbc7b0; font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase;">Today</span>
    <span style="color: #6b6660; font-size: 13px;">text in, nothing else</span>
  </div>

  <div style="max-width: 780px; margin: 0 auto;">
    <div style="display: flex; align-items: flex-end; gap: 8px; background: #fdfcfa; border: 1px solid #e7e3dc; border-radius: 26px; padding: 8px 8px 8px 20px; box-shadow: 0 6px 18px rgba(31,31,31,0.05);">
      <div style="flex: 1; color: #6b6660; padding: 7px 0;">Ask about incidents, catalog items, groups or users&hellip;</div>
      <div style="flex: none; width: 38px; height: 38px; border-radius: 50%; background: #f1eee9; display: grid; place-items: center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#a9a39b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 19V5"></path><path d="m5 12 7-7 7 7"></path>
        </svg>
      </div>
    </div>

    <div style="margin-top: 26px; display: flex; flex-direction: column; gap: 9px;">
      <div style="display: flex; gap: 9px; align-items: flex-start; color: #6b6660; font-size: 13px;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#b33a0c" stroke-width="2" stroke-linecap="round" style="flex: none; margin-top: 3px;"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>
        No way to hand it a screenshot of an incident form or an error dialog
      </div>
      <div style="display: flex; gap: 9px; align-items: flex-start; color: #6b6660; font-size: 13px;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#b33a0c" stroke-width="2" stroke-linecap="round" style="flex: none; margin-top: 3px;"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>
        No way to attach a CSV of records to work through
      </div>
      <div style="display: flex; gap: 9px; align-items: flex-start; color: #6b6660; font-size: 13px;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#b33a0c" stroke-width="2" stroke-linecap="round" style="flex: none; margin-top: 3px;"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>
        Nothing shows whether writes are on before you ask for a change
      </div>
    </div>
  </div>
</div>

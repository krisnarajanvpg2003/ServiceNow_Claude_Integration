<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif; font-size: 15px; line-height: 1.5; }
    a { color: #ffc800; } a:hover { color: #ffd84d; }
  </style>
</helmet>

<div style="background: #1f1f1f; padding: 26px 28px 34px; min-height: 100%; box-sizing: border-box; color: #f2efe9;">

  <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 22px;">
    <span style="display: inline-block; padding: 3px 9px; border-radius: 999px; background: #33301f; color: #ffc800; border: 1px solid rgba(255,200,0,0.35); font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase;">Dark mode</span>
    <span style="color: #b9b4ac; font-size: 13px;">menu open, and a file being uploaded</span>
  </div>

  <div style="max-width: 780px; margin: 0 auto; position: relative;">

    <div style="position: absolute; left: 0; bottom: 100%; margin-bottom: 10px; width: 268px; background: #262626; border: 1px solid #3a3a3a; border-radius: 12px; box-shadow: 0 10px 28px rgba(0,0,0,0.5); padding: 6px;">
      <div style="display: flex; align-items: center; gap: 11px; padding: 9px 10px; border-radius: 8px; background: #2a2a2a;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#f2efe9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex: none;">
          <path d="M12 16V4"></path><path d="m7 9 5-5 5 5"></path><path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"></path>
        </svg>
        <div>
          <div style="font-size: 14px;">Upload from computer</div>
          <div style="font-size: 11.5px; color: #b9b4ac;">Images, CSV, PDF, text</div>
        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 11px; padding: 9px 10px; border-radius: 8px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#f2efe9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex: none;">
          <rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M8 10h8"></path><path d="M8 14h5"></path>
        </svg>
        <div>
          <div style="font-size: 14px;">Attach a saved dataset</div>
          <div style="font-size: 11.5px; color: #b9b4ac;">From datasets/</div>
        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 11px; padding: 9px 10px; border-radius: 8px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#f2efe9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex: none;">
          <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"></path><path d="M14 3v5h5"></path>
        </svg>
        <div>
          <div style="font-size: 14px;">Attach an export</div>
          <div style="font-size: 11.5px; color: #b9b4ac;">A PDF or Excel file you already made</div>
        </div>
      </div>
    </div>

    <div style="background: #262626; border: 1px solid #ffc800; border-radius: 26px; padding: 10px 10px 8px; box-shadow: 0 6px 18px rgba(0,0,0,0.45);">

      <div style="display: flex; flex-wrap: wrap; gap: 8px; padding: 2px 8px 10px;">
        <div style="display: flex; align-items: center; gap: 9px; padding: 6px 8px 6px 6px; border: 1px solid #3a3a3a; border-radius: 10px; background: #2e2e2e; min-width: 210px;">
          <div style="flex: none; width: 34px; height: 34px; border-radius: 7px; background: #0f0f0f; border: 1px solid #3a3a3a; display: grid; place-items: center;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#b9b4ac" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="16" rx="2"></rect><circle cx="8.5" cy="9.5" r="1.5"></circle><path d="m21 16-5-5L5 20"></path>
            </svg>
          </div>
          <div style="min-width: 0; flex: 1;">
            <div style="font-size: 12.5px;">incident-form.png</div>
            <div style="height: 4px; border-radius: 999px; background: #3a3a3a; margin-top: 5px; overflow: hidden;">
              <div style="width: 62%; height: 100%; background: #ffc800;"></div>
            </div>
          </div>
        </div>
      </div>

      <div style="padding: 0 10px 6px;">
        <div style="color: #b9b4ac; padding: 5px 0;">What should I do with these?</div>
      </div>

      <div style="display: flex; align-items: center; gap: 8px; padding: 2px 2px 0;">
        <div style="flex: none; width: 32px; height: 32px; border-radius: 9px; border: 1px solid rgba(255,200,0,0.35); background: #33301f; display: grid; place-items: center;">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#f2efe9" stroke-width="2" stroke-linecap="round" style="transform: rotate(45deg);">
            <path d="M12 5v14"></path><path d="M5 12h14"></path>
          </svg>
        </div>
        <div style="flex: none; display: flex; align-items: center; gap: 7px; height: 32px; padding: 0 11px; border-radius: 9px; border: 1px solid #3a3a3a; background: #2e2e2e;">
          <span style="width: 7px; height: 7px; border-radius: 50%; background: #7bd8a8;"></span>
          <span style="font-size: 12.5px;">Claude</span>
        </div>
        <div style="flex: none; display: flex; align-items: center; height: 32px; padding: 0 11px; border-radius: 9px; background: #2e2e2e; color: #b9b4ac; font-size: 12.5px;">Writes on</div>
        <div style="flex: 1;"></div>
        <div style="flex: none; width: 38px; height: 38px; border-radius: 50%; background: #ffc800; display: grid; place-items: center;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1f1f1f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 19V5"></path><path d="m5 12 7-7 7 7"></path>
          </svg>
        </div>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
